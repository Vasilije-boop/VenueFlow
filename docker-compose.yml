services:
  postgres:
    image: postgres:16-alpine
    container_name: venueflow_db
    restart: always
    environment:
      POSTGRES_USER: venue_user
      POSTGRES_PASSWORD: venue_pass
      POSTGRES_DB: venueflow_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: venueflow_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=venue_user
      - DB_PASSWORD=venue_pass
      - DB_NAME=venueflow_db
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata: